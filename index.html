<style>
:root{--navy:#003f3f;--bg:#f3f6f6;--panel:#fff;--panel2:#f7fbfb;--bd:#e1ebeb;--tx:#162929;--dim:#4c5e5e;--faint:#708484;--blue:#008080;--green:#1fa15a;--gd:#e6f7ee;--amber:#f5921f;--ad:#fef2e2;--red:#e2483c;--rd:#fdeceb;--navytx:#003f3f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1818;--panel:#132424;--panel2:#182c2c;--bd:#264646;--tx:#ecf5f5;--dim:#b3c8c8;--faint:#628080;--gd:#0f3a27;--ad:#3d2a0e;--rd:#40191a;--navytx:#ecf5f5}}
:root[data-theme="dark"]{--bg:#0c1818;--panel:#132424;--panel2:#182c2c;--bd:#264646;--tx:#ecf5f5;--dim:#b3c8c8;--faint:#628080;--gd:#0f3a27;--ad:#3d2a0e;--rd:#40191a;--navytx:#ecf5f5}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sidebar{width:264px;flex-shrink:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#003f3f,#004d4d 60%,#006666);color:#e7f3f3;transition:width .25s;overflow:hidden;z-index:80}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px;min-height:68px;border-bottom:3px solid #008080}
.sb-btn{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;font-size:15px;flex-shrink:0}
.sb-btn:hover{background:rgba(255,255,255,.16)}
.sb-head img{width:46px;height:46px;border-radius:10px;background:#fff;object-fit:contain;flex-shrink:0}
.sb-title{color:#fff;font-weight:800;font-size:14.5px;line-height:1.15;white-space:nowrap}.sb-title small{display:block;color:#cee6e6;font-weight:500;font-size:10.5px;margin-top:2px}
.sb-label{font-size:10px;letter-spacing:1.6px;font-weight:700;color:#c0dcdc;padding:16px 16px 6px}
.sb-nav{flex:1;overflow-y:auto;padding:0 10px}
.grp>button{width:100%;display:flex;align-items:center;gap:10px;padding:11px 10px;margin-bottom:4px;border:0;border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font:700 13.5px Inter;cursor:pointer;text-align:left;white-space:nowrap}
.grp>button:hover{background:rgba(255,255,255,.12)}.grp.on>button{background:linear-gradient(90deg,rgba(40,168,168,.65),rgba(40,168,168,.15));box-shadow:inset 3px 0 0 #9de2e2}
.grp>button span{flex:1}.grp>button i{font-style:normal;font-size:10px;opacity:.7;transition:.2s}.grp.open>button i{transform:rotate(90deg)}
.sub{max-height:0;overflow:hidden;transition:max-height .3s;margin-left:20px;border-left:1px dashed rgba(255,255,255,.25);padding-left:8px}.grp.open .sub{max-height:400px;padding:4px 0 8px 8px}
.it{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;margin:2px 0;border:0;border-radius:9px;background:none;color:#ddecec;font:600 12.5px Inter;cursor:pointer;white-space:nowrap;text-align:left}

 Chart.defaults.color=css('--dim');Chart.defaults.font.family='Inter';Chart.defaults.borderColor=css('--bd');
 const base={responsive:true,maintainAspectRatio:false},nodl={display:false},legend={position:'top',align:'end',labels:{usePointStyle:true,pointStyle:'line',boxWidth:30,boxHeight:12,padding:14,font:{size:12,weight:'600'}}},labs=MD.map(r=>ML(r.m)),panel=css('--panel')||'#fff';
 /* one bar per month: selected = teal, compared = orange, others = grey */
 const bars=(id,vals,fmt)=>{charts[id]=new Chart($(id),{type:'bar',data:{labels:labs,datasets:[{data:vals,backgroundColor:MD.map(r=>col(r.m)),borderRadius:8,maxBarThickness:62,datalabels:DL(true,{anchor:'end',align:'end',offset:3,font:{size:12,weight:'800'},formatter:fmt})}]},
  options:{...base,layout:{padding:{top:24}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmt(c.parsed.y)}}},scales:{y:{display:false,beginAtZero:true,grace:'8%'},x:{grid:{display:false},border:{color:css('--bd')},ticks:{font:{size:11,weight:'600'}}}}}})};
 bars('m1',MD.map(r=>V(r,r.tot)),v=>f(v)+' kWh');

 /* day-by-day lines (peak day labelled) */
 const mkLine=(m,get,c,fill,dash)=>{const byDay={};m.I.forEach(i=>byDay[+D.dates[i].slice(8,10)]=get(i));const data=Array.from({length:31},(_,i)=>byDay[i+1]==null?null:byDay[i+1]),mxv=Math.max(...data.filter(x=>x!=null),0),pk=data.indexOf(mxv);
  return{label:ML(m.m),borderColor:c,backgroundColor:fill,fill:!!fill,borderWidth:m.m===mo?3.4:2.4,borderDash:dash||[],pointRadius:x=>x.dataIndex===pk?5.5:(m.m===mo?2.5:0),pointBackgroundColor:c,pointBorderColor:'#fff',pointBorderWidth:1.5,pointHoverRadius:5,tension:.3,cubicInterpolationMode:'monotone',spanGaps:false,order:m.m===mo?0:1,data,
   datalabels:{display:x=>x.dataIndex===pk&&mxv>0,anchor:'end',align:'top',offset:6,clip:false,color:c,backgroundColor:panel,borderColor:c,borderWidth:1.5,borderRadius:6,padding:{top:2,bottom:2,left:6,right:6},font:{size:11,weight:'800'},formatter:v=>f(v)}}};
 const lineOpts=(pad)=>({...base,interaction:{mode:'index',intersect:false},layout:{padding:{top:pad,right:10}},plugins:{legend:{display:false},tooltip:{callbacks:{title:t=>'Day '+t[0].label,label:c=>c.parsed.y==null?'':' '+c.dataset.label+': '+f(c.parsed.y,1)+' kWh'}}},scales:{x:{title:{display:true,text:'Day of month',font:{size:11}},ticks:{font:{size:10}},grid:{display:false}},y:{beginAtZero:true,grace:'6%',ticks:{font:{size:10},callback:v=>f(v)}}}});
 charts.m4=new Chart($('m4'),{type:'line',data:{labels:Array.from({length:31},(_,i)=>i+1),datasets:[mkLine(sel,i=>sel.dayTot[sel.I.indexOf(i)],CS,'rgba(0,128,128,.14)'),mkLine(cmp,i=>cmp.dayTot[cmp.I.indexOf(i)],CC,null,[7,5])]},options:lineOpts(34)});
 /* ---------- drill-down ---------- */
 const chip=(l,v,u,s,c)=>`<div style="border:1px solid var(--bd);border-top:3px solid ${c};border-radius:9px;padding:8px 10px;background:var(--panel2);min-width:0"><div style="font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);font-weight:700">${l}</div><div style="font-size:19px;font-weight:800;color:var(--tx);line-height:1.25">${v}<span style="font-size:11px;font-weight:600;color:var(--dim)"> ${u}</span></div><div style="font-size:10.5px;color:var(--dim);min-height:15px">${s}</div></div>`;
 const renderDrill=()=>{const n=S.cmDep,ri=A.findIndex(a=>a.n===n),a=A[ri],r=rows.find(x=>x.n===n);if(!a||!r)return;
  if(charts.m6){charts.m6.destroy();delete charts.m6}
  document.querySelectorAll('.cmx-row').forEach(el=>el.classList.toggle('act',el.dataset.n===n));

  $('drill').innerHTML=`<select style="font-weight:700;width:100%;max-width:none;margin-bottom:10px" onchange="cmDrill(this.value)">${depNames.map(x=>`<option ${x===n?'selected':''}>${x}</option>`).join('')}</select>
   <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px">${chip(ML(mo),f(r.s,dg),U,'selected month',CS)}${chip(ML(cm),f(r.c,dg),U,'compared month',CC)}${chip('Change',sg(r.d,dg),U,`${pill(r.p)} ${r.p>0?'used more':r.p<0?'used less':''}`,r.d>0?'#e2483c':'#1fa15a')}${chip('Month total',f(sum(sel.I.map(i=>a.v[i]))),'kWh',ML(mo)+' · '+sel.days+' days','#004d4d')}${chip('Share of plant',f(r.s/planTot*100,1),'%','in '+ML(mo),'#3f8fd2')}${chip('Peak day',f(pk),'kWh',dd(pki),'#7b5ea7')}</div>
   <div class="cmx-mh" style="margin:0 0 6px"><div class="cmx-hint" style="margin:0">${n}: consumption each day (kWh)</div>${key}</div><div style="position:relative;flex:1;min-height:250px"><canvas id="m6"></canvas></div>`;
  charts.m6=new Chart($('m6'),{type:'line',data:{labels:Array.from({length:31},(_,i)=>i+1),datasets:[mkLine(sel,i=>a.v[i],CS,'rgba(0,128,128,.14)'),mkLine(cmp,i=>a.v[i],CC,null,[7,5])]},options:lineOpts(30)})};
 window.cmDrill=n=>{S.cmDep=n;renderDrill()};
 renderDrill();
}
